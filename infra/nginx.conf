worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No raw URI/query, cookies, authorization, referrer or user-agent in logs.
    log_format operational escape=json '{"trace_id":"$request_id","status":$status,"elapsed_seconds":$request_time}';
    access_log /dev/stdout operational;
    error_log /dev/stderr crit;
    proxy_cache off;
    server {
        listen 8080;
        root /srv/frontend;
        # File limits and TLS/public ingress require D12/D07 review before exposure.
        client_max_body_size 1m;
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }
        # No storage mount, alias, X-Accel-Redirect or direct file-serving location.
        location ~ ^/(storage|private|public-copies|persistent)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
