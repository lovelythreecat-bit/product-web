<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">映作 · 电商 AI 创作平台</title>
  <desc id="desc">围绕同一份商品资料，分步完成文案、图片与视频创作。奶油米色与陶土橙沿用项目界面，取景框标志来自映作品牌图形。</desc>
  <rect width="1200" height="400" rx="24" fill="#f8f3ed"/>
  <g font-family="'Microsoft YaHei UI','PingFang SC','Noto Sans SC',sans-serif">
    <g id="identity" transform="translate(56 48)">
      <g transform="scale(1.4)">
        <rect width="40" height="40" rx="11" fill="#a94e32"/>
        <path d="M11 17v-4a2 2 0 0 1 2-2h4m6 0h4a2 2 0 0 1 2 2v4m0 6v4a2 2 0 0 1-2 2h-4m-6 0h-4a2 2 0 0 1-2-2v-4" fill="none" stroke="#fffdfa" stroke-width="2" stroke-linecap="round"/>
        <path d="m17 14 9 6-9 6V14Z" fill="#fffdfa"/>
      </g>
      <text x="76" y="39" fill="#706259" font-size="24" letter-spacing="3">电商 AI 创作平台</text>
      <text x="-4" y="174" fill="#322823" font-size="112" font-weight="700" letter-spacing="8">映作</text>
    </g>
    <g id="promise" fill="#322823" font-size="44" font-weight="600">
      <text x="620" y="134">从一份商品资料，</text>
      <text x="620" y="197">到多种内容表达。</text>
    </g>
    <path d="M56 269H1144" stroke="#e7d9ca" stroke-width="2"/>
    <g id="creation-sequence" font-size="32" font-weight="600">
      <text x="56" y="338" fill="#706259" font-size="20" font-weight="400">01</text>
      <text x="98" y="340" fill="#322823">商品资料</text>
      <text x="365" y="338" fill="#a94e32" font-size="20" font-weight="400">02</text>
      <text x="407" y="340" fill="#a94e32">文案</text>
      <text x="665" y="338" fill="#a94e32" font-size="20" font-weight="400">03</text>
      <text x="707" y="340" fill="#a94e32">图片</text>
      <text x="965" y="338" fill="#a94e32" font-size="20" font-weight="400">04</text>
      <text x="1007" y="340" fill="#a94e32">视频</text>
    </g>
    <g id="sequence-arrows" fill="none" stroke="#a94e32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M280 328h40m-8-7 8 7-8 7M557 328h40m-8-7 8 7-8 7M857 328h40m-8-7 8 7-8 7"/>
    </g>
  </g>
