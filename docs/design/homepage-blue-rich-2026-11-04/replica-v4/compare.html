<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞马首页 · 设计与实现对照</title><style>*{box-sizing:border-box}body{margin:0;background:#e8edf4;color:#102957;font:15px/1.5 'Microsoft YaHei',sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;padding:12px 22px;box-shadow:0 1px 9px #1232;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:18px;margin:0}a{color:#1257d7}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:2100px;margin:auto}.column{min-width:0}h2{font-size:16px;text-align:center;margin:4px 0 10px}.stack{position:relative;width:100%;line-height:0}.stack img{width:100%;height:auto;display:block}.implementation{position:absolute;top:0;left:0;width:100%;opacity:var(--opacity,1)}.note{line-height:1.5;margin:12px 0;color:#405674}@media(max-width:700px){.grid{grid-template-columns:1fr}header{position:static}}</style><header><h1>设计图 / 实际网页截图</h1><a href="../../../../standalone/feima-home-v4/index.html">打开独立首页</a><label>右栏实现图透明度<input id="opacity" type="range" min="0" max="100" value="100"><output id="value">100%</output></label></header><main class="grid"><section class="column"><h2>已确认设计图 · 1024px 基准</h2><div class="stack"><img src="../revision-v3/upper-v3.png" alt="上段设计图"><img src="../revision-v3/middle-v3.png" alt="中段设计图"><img src="../revision-v3/lower-v3.png" alt="下段设计图"></div></section><section class="column"><h2>实际 HTML · 同尺寸截图</h2><div class="stack"><img src="../revision-v3/upper-v3.png" alt="对照底图上段"><img src="../revision-v3/middle-v3.png" alt="对照底图中段"><img src="../revision-v3/lower-v3.png" alt="对照底图下段"><div class="implementation" id="actual"><img src="evidence/desktop-full-1024.png" alt="实际网页全页截图"></div></div><p class="note">调节透明度可查看实现与设计的位置差异。实际截图保留真实页面高度。</p></section></main><script>document.querySelector('#opacity').addEventListener('input',e=>{document.querySelector('#actual').style.opacity=e.target.value/100;document.querySelector('#value').value=e.target.value+'%';});</script></html>
