r(--blue);font-weight:600}.footer button:hover{text-decoration:underline;text-underline-offset:4px}.notice{padding:12px 14px;background:var(--selected);border-radius:8px;color:var(--blue);font-size:12px;margin-top:18px}.review{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 2px 24px;color:var(--muted);font-size:11px}.review span:last-child{opacity:.9}[hidden]{display:none!important}

.showcase .copy{padding-bottom:0}.showcase .copy p{max-width:330px}.art{inset:14px 20% 22px 12%}.capabilities{margin-top:12px;padding-block:19px;position:relative}.motion-toggle{position:absolute;z-index:3;right:16px;top:16px;width:36px;height:36px;display:grid;place-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:var(--panel)}.motion-toggle svg{width:16px;height:16px}.motion-toggle:hover{color:var(--blue)}

</style>

<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20.5 14A8.7 8.7 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="m14 4 6 6M4 20l2-7L16 3l5 5L11 18l-7 2Zm0 2h16"/></symbol>
<symbol id="picture" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
<symbol id="video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></symbol>
</defs></svg>
<div class="page">
<header class="topbar"><a class="brand" href="../feima-ui-2026-10-29/index.html" aria-label="飞马首页设计预览"><img src="../../../frontend/src/assets/feima-logo-blue.png" alt=""><span>飞马工作台</span></a><nav class="actions" aria-label="账户导航"><button class="quiet" id="theme-toggle" aria-label="切换到深色主题"><svg aria-hidden="true"><use href="#moon"/></svg></button><button class="quiet top-login" data-mode="login">登录</button><button class="outline top-register" data-mode="register">注册体验</button></nav></header>
<main class="login-shell">
<aside class="showcase" aria-label="飞马电商创作">
<button class="motion-toggle" aria-label="暂停展示动画" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
<div class="copy"><h2>让好商品，<br><em>亮眼登场。</em></h2><p>从一份商品素材，<br>开启文案、图片与视频创作。</p></div>
<div class="creative-stage"><div class="orbit" aria-hidden="true"></div><div class="stage-depth">
<div class="art"><img class="light" src="../../../frontend/src/assets/auth/product-stage-light.webp" alt="运动鞋、耳机与护肤瓶的商品创作示例"><img class="dark" src="../../../frontend/src/assets/auth/product-stage-dark.webp" alt="运动鞋、耳机与护肤瓶的商品创作示例"><span class="picture-label"><svg aria-hidden="true"><use href="#picture"/></svg>商品图片</span><span class="caption">创作示例</span></div>
<div class="copy-sample"><span class="sample-label"><svg aria-hidden="true"><use href="#pen"/></svg>电商文案</span><p class="sample-text">让每一步，都出彩。</p><span class="sample-note">文案创作示例</span></div>
<div class="video-sample"><svg aria-hidden="true"><use href="#video"/></svg><div><strong>产品视频</strong><span class="video-frames" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></div>
</div></div>
<div class="capabilities"><span><svg aria-hidden="true"><use href="#pen"/></svg>电商文案</span><span><svg aria-hidden="true"><use href="#picture"/></svg>商品图片</span><span><svg aria-hidden="true"><use href="#video"/></svg>产品视频</span></div></aside>
<section class="form-panel" aria-labelledby="title"><div class="form-body"><h1 id="title">欢迎回来</h1><p class="intro">使用账号密码，进入你的创作工作台。</p><nav class="tabs" aria-label="登录或注册"><button data-mode="login" aria-current="page">登录</button><button data-mode="register">注册</button></nav>
<form id="auth-form" novalidate autocomplete="off">
<div class="field"><div class="label-line"><label for="account">账号</label><span class="hint" id="account-help">3–64 个字符</span></div><div class="input"><svg aria-hidden="true"><use href="#user"/></svg><input id="account" placeholder="请输入账号" aria-describedby="account-help account-error" autocapitalize="off" spellcheck="false"></div><p id="account-error" class="error" role="alert"></p></div>
<div class="field"><div class="label-line"><label for="password">密码</label><span class="hint" id="password-help">10–128 个字符</span></div><div class="input"><svg aria-hidden="true"><use href="#lock"/></svg><input id="password" type="password" placeholder="请输入密码" autocomplete="new-password" aria-describedby="password-help password-error"></div><p id="password-error" class="error" role="alert"></p></div>
<div class="field" id="confirm-field" hidden><div class="label-line"><label for="confirmation">确认密码</label></div><div class="input"><svg aria-hidden="true"><use href="#lock"/></svg><input id="confirmation" type="password" placeholder="请再次输入密码" autocomplete="new-password" aria-describedby="confirmation-error"></div><p id="confirmation-error" class="error" role="alert"></p></div>
<button class="submit" type="submit">登录</button><p class="notice" id="preview-notice" role="status" hidden>这是设计预览，未提交账号信息，也不会创建真实账号。</p>
</form><p class="footer"><span id="footer-copy">还没有账号？</span><button id="footer-link" data-mode="register">注册体验</button></p></div></section>
</main><footer class="review"><span>设计预览 · 不连接账号服务</span><span>飞马蓝色双主题 / 2026.11.01</span></footer>
</div>
<script>
const root=document.documentElement, toggle=document.querySelector('#theme-toggle');
function setTheme(theme){root.dataset.theme=theme;toggle.setAttribute('aria-label',theme==='dark'?'切换到浅色主题':'切换到深色主题');toggle.querySelector('use').setAttribute('href',theme==='dark'?'#sun':'#moon')}
setTheme(new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light');toggle.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));
let register=false;
function setMode(mode){register=mode==='register';document.querySelector('#title').textContent=register?'注册体验':'欢迎回来';document.querySelector('#confirm-field').hidden=!register;document.querySelector('.submit').textContent=register?'创建账号':'登录';document.querySelector('#footer-copy').textContent=register?'已有账号？':'还没有账号？';const link=document.querySelector('#footer-link');link.textContent=register?'去登录':'注册体验';link.dataset.mode=register?'login':'register';document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.mode===mode)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#password').value='';document.querySelector('#confirmation').value='';clearErrors();document.querySelector('#preview-notice').hidden=true}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function clearErrors(){document.querySelectorAll('.error').forEach(p=>p.textContent='');document.querySelectorAll('input').forEach(i=>i.removeAttribute('aria-invalid'))}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{i.removeAttribute('aria-invalid');document.querySelector('#'+i.id+'-error').textContent='';document.querySelector('#preview-notice').hidden=true}));
document.querySelector('#auth-form').addEventListener('submit',event=>{event.preventDefault();clearErrors();let first;for(const [id,min,max]of [['account',3,64],['password',10,128]]){const input=document.querySelector('#'+id);if([...input.value].length<min||[...input.value].length>max){document.querySelector('#'+id+'-error').textContent=(id==='account'?'账号':'密码')+'需要 '+min+'–'+max+' 个字符。';input.setAttribute('aria-invalid','true');first??=input}}if(register&&document.querySelector('#password').value!==document.querySelector('#confirmation').value){const input=document.querySelector('#confirmation');document.querySelector('#confirmation-error').textContent='两次密码不一致，请重新确认。';input.setAttribute('aria-invalid','true');first??=input}if(first){first.focus();return}document.querySelector('#preview-notice').hidden=false});
const showcase=document.querySelector('.showcase'),stage=document.querySelector('.creative-stage'),motionButton=document.querySelector('.motion-toggle');
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),desktop=matchMedia('(min-width: 801px)'),pointer=matchMedia('(hover: hover) and (pointer: fine)');
let userPaused=false,onScreen=true;
function syncMotion(){showcase.dataset.paused=String(userPaused||document.hidden||!onScreen||reduced.matches||!desktop.matches);if(showcase.dataset.paused==='true'){stage.style.setProperty('--tilt-x','0deg');stage.style.setProperty('--tilt-y','0deg')}}
motionButton.addEventListener('click',()=>{userPaused=!userPaused;motionButton.setAttribute('aria-pressed',String(userPaused));motionButton.setAttribute('aria-label',userPaused?'播放展示动画':'暂停展示动画');motionButton.querySelector('path').setAttribute('d',userPaused?'m8 5 11 7-11 7Z':'M9 5v14M15 5v14');syncMotion()});
document.addEventListener('visibilitychange',syncMotion);reduced.addEventListener('change',syncMotion);desktop.addEventListener('change',syncMotion);new IntersectionObserver(entries=>{onScreen=entries[0].isIntersecting;syncMotion()}).observe(showcase);
stage.addEventListener('pointermove',event=>{if(showcase.dataset.paused==='true'||!pointer.matches)return;const r=stage.getBoundingClientRect();stage.style.setProperty('--tilt-x',((.5-(event.clientY-r.top)/r.height)*5).toFixed(2)+'deg');stage.style.setProperty('--tilt-y',(((event.clientX-r.left)/r.width-.5)*7).toFixed(2)+'deg')});stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--tilt-x','0deg');stage.style.setProperty('--tilt-y','0deg')});syncMotion();
</script>
